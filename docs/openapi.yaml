      responses:
        '201': { description: أُنشئ }
    put:
      tags: [System]
      summary: تعديل مستخدم/كلمة مرور — ADMIN
      responses:
        '200': { description: مُعدّل }
    delete:
      tags: [System]
      summary: تعطيل مستخدم (?id=) — ADMIN
      responses:
        '200': { description: تم }

